name: Publish to MCP Registry

on:
  push:
    branches: [master]
    paths:
      - server.json
      - package.json
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Validate server.json
        run: go run github.com/modelcontextprotocol/registry/cmd/publisher@latest validate server.json

      - name: Publish to MCP Registry
        run: go run github.com/modelcontextprotocol/registry/cmd/publisher@latest publish server.json
